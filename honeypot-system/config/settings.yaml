# ──────────────────────────────────────────────────────────────────────────────
# Honeypot-system default configuration
# Override any value with an environment variable using UPPER_SNAKE_CASE.
# Example: MQTT_HOST=broker.example.com overrides mqtt.host below.
# ──────────────────────────────────────────────────────────────────────────────

# ── MQTT broker ───────────────────────────────────────────────────────────────
mqtt:
  host:  "localhost"
  port:  1883
  topic: "eurosystem/logs"

debug:
  output_path: "/var/log/honeypot/debug.log"

# ── Log collectors ────────────────────────────────────────────────────────────
collectors:
  bash:
    path: 
      - "/root/.bash_history"
  auditd:
    path:
      - "/var/log/audit/audit.log"
  journald:
    unit:  ""          # empty = all units; set e.g. "sshd.service"
    lines: "500"
  apache:
    path:
      - "/var/log/apache2/access.log"
      - "/var/log/apache2/error.log"
  ftp:
    path:
      - "/var/log/vsftpd.log"
  cowrie:
    path: 
      - "/var/log/cowrie"

# ── Threat-intel enrichers ────────────────────────────────────────────────────
enrichers:
  virustotal:
    api_key: ""        # set via VT_API_KEY env var or here
  abuseipdb:
    api_key: ""
  shodan:
    api_key: ""

# ── Pipeline composition ──────────────────────────────────────────────────────
pipeline:
  services:    ["bash", "apache", "auditd", "ftp"]
  collectors:  ["bash", "apache", "auditd", "ftp"]
  publishers:  ["mqtt"]
  enrichers:   ["virustotal", "abuseipdb"] # shodan free plan can't query host api gateway
